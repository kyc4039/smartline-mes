# SMART LINE MES — 웹 구동 환경 (uv)
#   처음:      uv sync                      → .venv 생성 (몇 분 · 2~3GB)
#   RealSense: uv sync --extra realsense
#   실행:      uv run app.py                → http://localhost:5000
[project]
name = "smartline-mes"
version = "1.0.0"
description = "SMART LINE MES: 안전게이트 · 프레스 안전 · 품질검사 · 설비보전 AI를 묶은 관제 웹 (Flask)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.3",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.44",
    "tensorflow>=2.16",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "kiwipiepy>=0.18",
    "psutil>=5.9",
]

[project.optional-dependencies]
realsense = [
    "pyrealsense2>=2.55; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[tool.uv]
package = false          # 설치할 패키지가 아니라 실행하는 앱
