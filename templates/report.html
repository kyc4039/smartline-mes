{% extends "base.html" %}
{% block body %}
<div class="row toolbar">
  <div class="row" style="gap:10px;justify-content:flex-start"><h2 style="font-size:20px;margin:0">교대 보고서</h2><span class="badge t-idle" id="genAt"></span></div>
  <div class="row" style="gap:8px"><div class="seg-btns" id="ranges"></div>
    <button class="btn" onclick="load()">새로 고침</button><button class="btn primary" onclick="window.print()">인쇄 · PDF 저장</button></div>
</div>

<article class="paper" id="paper">
  <header class="p-head">
    <div><div class="p-sub">SMART LINE · LINE A</div><h1>교대 보고서</h1></div>
    <div class="p-meta" id="meta"></div>
  </header>
  <section class="p-sum" id="sum"></section>
  <section><h3>1. 사건 (정지 이력)</h3><table class="p-table" id="tInc"></table></section>
  <section><h3>2. 품질</h3><div id="qual" class="p-text"></div></section>
  <section><h3>3. 정비 요청</h3><table class="p-table" id="tTk"></table></section>
  <section>
    <h3>4. 다음 조 인계 사항 <span class="p-save" id="memoState"></span></h3>
    <textarea id="memo" class="p-memo" rows="5" placeholder="다음 조에 전할 내용을 적어 주세요"></textarea>
  </section>
  <footer class="p-foot"><div id="aiLine"></div><div>작성<br><br>(서명)</div><div>확인<br><br>(서명)</div></footer>
</article>

<script>
const URG = {"상": "즉시", "중": "당일", "하": "정기"}, TN = {"기계": "기계 정비", "전기": "전기·제어", "유압공압": "유공압", "센서": "센서·계측"};
let KEY = "", memoTimer;
const empty = (n, msg) => `<tr><td colspan="${n}" class="p-empty">${msg}</td></tr>`;
function draw(r) {
  const w = r.window, s = r.summary, o = r.oee, d = new Date(w.start * 1000);
  KEY = r.key;
  genAt.textContent = `자동 작성 · ${hm(Date.now() / 1000)} 기준`;
  meta.innerHTML = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} · ${esc(w.label)}<br>${hm(w.start)} ~ ${hm(w.end)} · 작성 ${hm(Date.now() / 1000)}`;
  sum.innerHTML = [["생산 (검사 수)", s.production], ["불량률", pctTxt(s.defect_rate)], ["OEE", pctTxt(o.oee)],
    ["라인 정지 시간", `${Math.round(s.line_down_min)}분`], ["사건", `${s.incidents}건`], ["정비 완료", `${s.tickets_done} / ${s.tickets}`]]
    .map(([k, v]) => `<div><div class="p-k">${k}</div><div class="p-v">${v}</div></div>`).join("");
  tInc.innerHTML = `<tr><th>시각</th><th>설비</th><th>원인 → 결과</th><th>복구</th><th class="r">정지</th></tr>` +
    (r.incidents.map(i => `<tr><td class="mono">${hm(i.start)}</td><td>${esc(i.equipment)}</td>
      <td>${i.steps.filter(x => x.kind !== "recover").map(x => esc(x.title)).join(" → ")}</td>
      <td>${i.recovery ? esc(i.recovery) : "<b>진행 중</b>"}</td><td class="r mono">${i.end ? mins(i.end - i.start) : "-"}</td></tr>`).join("")
     || empty(5, "이 기간에 사건이 없었습니다"));
  const types = Object.entries(r.defect_types).map(([k, v]) => `${esc(k)} ${v}`).join(", ");
  qual.innerHTML = `검사 ${s.production}개 · 불량 ${s.defects}개${types ? ` (${types})` : ""}` +
    (r.rate_over.length ? `<div class="p-alert">불량률 기준 초과 ${r.rate_over.length}회 · ${r.rate_over.map(hm).join(", ")}</div>` : "");
  tTk.innerHTML = `<tr><th>#</th><th>설비</th><th>증상</th><th>AI 판정</th><th>상태</th></tr>` +
    (r.tickets.map(t => `<tr><td>${t.id}</td><td>${esc(t.equipment)}</td><td>${esc(t.text)}</td>
      <td>${TN[t.type] || t.type} · ${URG[t.urgency]}${t.ai_check ? ` (${esc(t.ai_check)})` : ""}</td>
      <td>${t.status === "완료" ? "완료" : '<b class="p-warn">다음 조로 인계</b>'}</td></tr>`).join("")
     || empty(5, "이 기간에 정비 요청이 없었습니다"));
  if (document.activeElement !== memo) memo.value = r.memo || r.hints.map(h => "• " + h).join("\n");
  memoState.textContent = r.memo ? "저장됨" : (r.hints.length ? "자동 제안 · 고치면 저장돼요" : "");
  aiLine.textContent = r.ai.n ? `AI 판정 정확도 (이번 기간 피드백 ${r.ai.n}건) ${pctTxt(r.ai.ok / r.ai.n)} · 즉시 조치 놓침 ${r.ai.missed}건`
                              : "AI 판정 피드백 없음";
}
memo.addEventListener("input", () => {
  memoState.textContent = "저장 중...";
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => fetch("/api/report/memo", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({key: KEY, text: memo.value})}).then(() => memoState.textContent = "저장됨"), 600);
});
function load() { fetch("/api/report?range=" + currentRange()).then(r => r.json()).then(draw).catch(() => {}); }
rangeButtons(ranges, load);
load();
poll(() => {});
</script>
{% endblock %}
